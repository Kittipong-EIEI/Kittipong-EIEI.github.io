<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วัตถุดิบของฉัน - กินอะไรดี</title>
    <link rel="stylesheet" href="food.css">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <h1>📦 วัตถุดิบของฉัน</h1>
            <p>จัดการวัตถุดิบและรับคำแนะนำเมนูจาก AI</p>
        </div>

        <!-- Add Zone -->
        <div class="add-zone">
            <div class="add-methods">
                <button class="add-btn" onclick="openCamera()">
                    <span class="add-btn-icon">📸</span>
                    <span>ถ่ายรูปวัตถุดิบ</span>
                </button>
                <button class="add-btn" onclick="toggleManualAdd()">
                    <span class="add-btn-icon">✏️</span>
                    <span>กรอกข้อมูลเอง</span>
                </button>
            </div>

            <div class="manual-add" id="manualAddForm" style="display: none;">
                <div class="input-group">
                    <label class="input-label">ชื่อวัตถุดิบ</label>
                    <input type="text" class="input-field" id="ingredientName" placeholder="เช่น หมูสับ, ไก่, ผักกาด">
                </div>
                <div class="input-group">
                    <label class="input-label">ปริมาณ</label>
                    <input type="text" class="input-field" id="ingredientAmount" placeholder="เช่น 500g, 1 ถ้วย, 5 ใบ">
                </div>
                <div class="input-group">
                    <label class="input-label">วันหมดอายุ</label>
                    <input type="date" class="input-field" id="ingredientExpiry">
                </div>
                <button class="submit-btn" onclick="addIngredientManual()">เพิ่มวัตถุดิบ</button>
            </div>
        </div>

        <!-- Ingredients List -->
        <div class="ingredients-list">
            <div class="section-title">
                <span>🥬</span>
                วัตถุดิบทั้งหมด (<span id="totalCount">5</span> รายการ)
            </div>

            <div id="ingredientsList">
                <!-- Dynamic ingredients will be loaded here -->
            </div>

            <!-- AI Suggestions -->
            <div class="ai-suggestions">
                <div class="suggestion-title">
                    <span>🤖</span>
                    AI แนะนำเมนูจากวัตถุดิบที่มี
                </div>
                <div class="recipe-suggestions" id="aiSuggestions">
                    <!-- Dynamic suggestions will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Recipe Modal -->
        <a href="sol.html" target="_blank" class="recipe-card"></a>



        <!-- Camera Overlay -->
        <div class="camera-overlay" id="cameraOverlay">
            <div class="camera-content">
                <div class="camera-icon">📸</div>
                <h2>กำลังวิเคราะห์รูปภาพ...</h2>
                <p style="margin: 15px 0;">AI กำลังระบุวัตถุดิบในรูปภาพของคุณ</p>
                <div style="margin: 20px 0;">
                    <div style="font-size: 24px; margin: 10px 0;">🔍 กำลังสแกน...</div>
                </div>
                <button class="close-camera" onclick="closeCamera()">ปิด</button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <button class="nav-item" onclick="switchTab('home')">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">หน้าหลัก</span>
            </button>
            <button class="nav-item active" onclick="switchTab('ingredients')">
                <span class="nav-icon">📦</span>
                <span class="nav-text">วัตถุดิบ</span>
            </button>
            <button class="nav-item" onclick="switchTab('recipes')">
                <span class="nav-icon">🍽</span>
                <span class="nav-text">เมนู</span>
            </button>
            <button class="nav-item" onclick="switchTab('profile')">
                <span class="nav-icon">👤</span>
                <span class="nav-text">โปรไฟล์</span>
            </button>
        </div>
    </div>

    <script>
        // Global variables
        let ingredients = [
            { name: '🐷 หมูสับ', amount: '500g', expiry: '2025-09-15', daysLeft: 3 },
            { name: '🌿 ใบกะเพราา', amount: '1 ถ้วย', expiry: '2025-09-17', daysLeft: 7 },
            { name: '🥚 ไข่ไก่', amount: '6 ฟอง', expiry: '2025-09-12', daysLeft: 2 },
            { name: '🧅 หอมแดง', amount: '200g', expiry: '2025-09-20', daysLeft: 10 },
            { name: '🥛 นมสด', amount: '1 ลิตร', expiry: '2025-09-11', daysLeft: 1 },
            { name: '🌶️ พริกแกง', amount: '1 ลิตร', expiry: '2025-09-11', daysLeft: 1 }
        ];

        let currentRecipe = null;
        let currentStep = 0;
        let cookingStarted = false;
        let timer = null;
        let totalTime = 0;

        const recipeDatabase = {
            
            'ผัดกะเพราหมูสับ': {
                name: 'ผัดกะเพราหมูสับ',
                calories: 180,
                time: 8,
                ingredients: ['ไข่ไก่', 'หอมแดง'],
                steps: [
                    { text: 'ตีไข่ในชามใหญ่ให้เข้ากัน เติมเกลือนิดหน่อย', time: 1, timer: false },
                    { text: 'หั่นหอมแดงเป็นชิ้นบาง ๆ ใส่ลงในไข่ตี', time: 2, timer: false },
                    { text: 'ตั้งกะทะด้วยไฟปานกลาง เทน้ำมันพืชให้ร้อน', time: 1, timer: true },
                    { text: 'เทไข่ลงกะทะ ปล่อยให้แข็งด้านล่างก่อน', time: 2, timer: true },
                    { text: 'พลิกไข่เจียวอีกด้านหนึ่ง ทอดจนเหลือง', time: 2, timer: true }
                ]
            },
            'หมูสับผัดหอมแดง': {
                name: 'หมูสับผัดหอมแดง',
                calories: 280,
                time: 12,
                ingredients: ['หมูสับ', 'หอมแดง'],
                steps: [
                    { text: 'หั่นหอมแดงเป็นชิ้น ตั้งกะทะให้ร้อน', time: 2, timer: false },
                    { text: 'ใส่น้ำมัน ผัดหอมแดงจนใส หอม', time: 3, timer: true },
                    { text: 'ใส่หมูสับ ผัดจนสุก เนื้อแห้ง', time: 5, timer: true },
                    { text: 'ปรุงรสด้วยซีอิ๊วขาว น้ำปลา น้ำตาล', time: 1, timer: false },
                    { text: 'ผัดให้เข้ากัน ชิมรส จัดเสิร์ฟ', time: 1, timer: false }
                ]
            }
        };

        // Initialize app
        document.addEventListener('DOMContentLoaded', function () {
            updateIngredientsList();
            generateAISuggestions();
            setupEventListeners();
            checkExpiringIngredients();

            // Set default expiry date (next week)
            const nextWeek = new Date();
            nextWeek.setDate(nextWeek.getDate() + 7);
            document.getElementById('ingredientExpiry').value = nextWeek.toISOString().split('T')[0];
        });

        function setupEventListeners() {
            // Rating stars
            document.querySelectorAll('.star').forEach(star => {
                star.addEventListener('click', function () {
                    const rating = parseInt(this.dataset.rating);
                    updateStarRating(rating);
                });

                star.addEventListener('mouseover', function () {
                    const rating = parseInt(this.dataset.rating);
                    highlightStars(rating);
                });
            });

            document.querySelector('.stars-container').addEventListener('mouseleave', function () {
                const currentRating = getCurrentRating();
                highlightStars(currentRating);
            });
        }

        function updateStarRating(rating) {
            document.querySelectorAll('.star').forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function highlightStars(rating) {
            document.querySelectorAll('.star').forEach((star, index) => {
                if (index < rating) {
                    star.style.color = '#ffd700';
                } else {
                    star.style.color = '#ddd';
                }
            });
        }

        function getCurrentRating() {
            return document.querySelectorAll('.star.active').length;
        }

        // Ingredient management functions
        function toggleManualAdd() {
            const form = document.getElementById('manualAddForm');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        function addIngredientManual() {
            const name = document.getElementById('ingredientName').value.trim();
            const amount = document.getElementById('ingredientAmount').value.trim();
            const expiry = document.getElementById('ingredientExpiry').value;

            if (!name || !amount || !expiry) {
                alert('❌ กรุณากรอกข้อมูลให้ครบถ้วน');
                return;
            }

            const today = new Date();
            const expiryDate = new Date(expiry);
            const daysLeft = Math.ceil((expiryDate - today) / (1000 * 60 * 60 * 24));

            const emojiMap = {
                'หมู': '🐷', 'ไก่': '🐔', 'เนื้อ': '🐄', 'ปลา': '🐟', 'กุ้ง': '🦐',
                'ไข่': '🥚', 'นม': '🥛', 'เนย': '🧈', 'ชีส': '🧀',
                'ข้าว': '🍚', 'เส้น': '🍜', 'แป้ง': '🌾',
                'กะเพรา': '🌿', 'ผัก': '🥬', 'หอม': '🧅', 'กระเทียม': '🧄',
                'มะเขือเทศ': '🍅', 'พริก': '🌶️', 'มะนาว': '🍋'
            };

            let emoji = '🥗';
            for (const [key, value] of Object.entries(emojiMap)) {
                if (name.includes(key)) {
                    emoji = value;
                    break;
                }
            }

            const ingredient = {
                name: `${emoji} ${name}`,
                amount: amount,
                expiry: expiry,
                daysLeft: daysLeft
            };

            ingredients.push(ingredient);
            updateIngredientsList();
            generateAISuggestions();

            document.getElementById('ingredientName').value = '';
            document.getElementById('ingredientAmount').value = '';
            document.getElementById('ingredientExpiry').value = '';

            alert(`✅ เพิ่ม "${name}" เรียบร้อยแล้ว!`);
            toggleManualAdd();
        }

        function removeIngredient(btn) {
            const card = btn.parentElement;
            const ingredientName = card.querySelector('.ingredient-name').textContent;

            if (confirm(`คุณต้องการลบ "${ingredientName}" หรือไม่?`)) {
                const index = ingredients.findIndex(ing => ing.name === ingredientName);
                if (index > -1) {
                    ingredients.splice(index, 1);
                }

                card.remove();
                updateTotalCount();
                generateAISuggestions();

                alert(`🗑️ ลบ "${ingredientName}" เรียบร้อยแล้ว`);
            }
        }

        function updateIngredientsList() {
            const list = document.getElementById('ingredientsList');
            list.innerHTML = '';

            ingredients.forEach(ingredient => {
                const expiryClass = ingredient.daysLeft <= 1 ? 'expiry-danger' :
                    ingredient.daysLeft <= 3 ? 'expiry-warning' : 'expiry-fresh';

                const card = document.createElement('div');
                card.className = 'ingredient-card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="removeIngredient(this)">×</button>
                    <div class="ingredient-header">
                        <span class="ingredient-name">${ingredient.name}</span>
                        <span class="ingredient-amount">${ingredient.amount}</span>
                    </div>
                    <div class="ingredient-details">
                        <span>เหลือ ${ingredient.daysLeft} วัน</span>
                        <span class="expiry-date ${expiryClass}">${new Date(ingredient.expiry).toLocaleDateString('th-TH')}</span>
                    </div>
                `;
                list.appendChild(card);
            });

            updateTotalCount();
        }

        function updateTotalCount() {
            document.getElementById('totalCount').textContent = ingredients.length;
        }

        function generateAISuggestions() {
    const suggestions = document.getElementById('aiSuggestions');
    suggestions.innerHTML = '';

    const availableRecipes = [];

    Object.keys(recipeDatabase).forEach(recipeName => {
        const recipe = recipeDatabase[recipeName];
        const hasIngredients = recipe.ingredients.every(reqIngredient => {
            return ingredients.some(availableIng =>
                availableIng.name.toLowerCase().includes(reqIngredient.toLowerCase())
            );
        });

        if (hasIngredients) {
            availableRecipes.push(recipe);
        }
    });

    // Sort by priority (expiring ingredients first)
    availableRecipes.sort((a, b) => {
        const aHasExpiring = a.ingredients.some(ing =>
            ingredients.some(availIng =>
                availIng.name.toLowerCase().includes(ing.toLowerCase()) && availIng.daysLeft <= 2
            )
        );
        const bHasExpiring = b.ingredients.some(ing =>
            ingredients.some(availIng =>
                availIng.name.toLowerCase().includes(ing.toLowerCase()) && availIng.daysLeft <= 2
            )
        );

        if (aHasExpiring && !bHasExpiring) return -1;
        if (!aHasExpiring && bHasExpiring) return 1;
        return a.calories - b.calories;
    });

    availableRecipes.forEach(recipe => {
        const hasExpiringIngredients = recipe.ingredients.some(ing =>
            ingredients.some(availIng =>
                availIng.name.toLowerCase().includes(ing.toLowerCase()) && availIng.daysLeft <= 2
            )
        );

        const card = document.createElement('a');
        card.className = 'recipe-card';
        card.href = 'sol.html';   // เปลี่ยนเป็น URL ที่ต้องการ
        card.target = '_blank';   // เปิดในแท็บใหม่ (ถ้าต้องการ)

        const urgencyText = hasExpiringIngredients ? ' ' : '';

        card.innerHTML = `
            <div class="recipe-name">${getRecipeEmoji(recipe.name)} ${recipe.name}${urgencyText}</div>
            <div class="recipe-info">
                <span>📊 ${recipe.calories} แคล</span>
                <span>⏰ ${recipe.time} นาที</span>
            </div>
            <div class="recipe-ingredients">ใช้: ${recipe.ingredients.join(', ')}</div>
        `;
        suggestions.appendChild(card);
    });

    if (availableRecipes.length === 0) {
        suggestions.innerHTML = `
            <div style="text-align: center; padding: 20px; opacity: 0.8;">
                <div style="font-size: 32px; margin-bottom: 10px;">🤔</div>
                <div>เพิ่มวัตถุดิบเพื่อรับคำแนะนำเมนูจาก AI</div>
            </div>
        `;
    }
}


        function getRecipeEmoji(recipeName) {
            const emojiMap = {
                'ผัดกะเพรา': '🍛',
                'ไข่เจียว': '🍳',
                'ไข่ดาว': '🍳',
                'ไข่ต้ม': '🥚',
                'ลาบ': '🥗',
                'นมสด': '🥛',
                'พุดดิ้ง': '🍮',
                'สลัด': '🥗',
                'ซุป': '🍲',
                'แกง': '🍛'
            };

            for (const [key, emoji] of Object.entries(emojiMap)) {
                if (recipeName.includes(key)) {
                    return emoji;
                }
            }
            return '🍽️';
        }

        // Recipe modal functions
        function openRecipeModal(recipe) {
            currentRecipe = recipe;
            currentStep = 0;
            cookingStarted = false;

            document.getElementById('recipeTitle').textContent = recipe.name;
            document.getElementById('recipeCalories').textContent = `📊 ${recipe.calories} แคล`;
            document.getElementById('recipeTime').textContent = `⏰ ${recipe.time} นาที`;

            displayRecipeIngredients(recipe);
            displayRecipeSteps(recipe);
            resetCookingControls();

            document.getElementById('recipeModal').classList.add('active');
        }

        function closeRecipeModal() {
            document.getElementById('recipeModal').classList.remove('active');
            stopTimer();
            resetCookingControls();
            currentRecipe = null;
            currentStep = 0;
            cookingStarted = false;
        }

        function displayRecipeIngredients(recipe) {
            const container = document.getElementById('recipeIngredients');
            container.innerHTML = '';

            recipe.ingredients.forEach(ingredient => {
                const available = ingredients.some(ing =>
                    ing.name.toLowerCase().includes(ingredient.toLowerCase())
                );

                const item = document.createElement('div');
                item.className = `ingredient-item ${available ? 'ingredient-available' : 'ingredient-missing'}`;
                item.innerHTML = `
                    <span>${ingredient}</span>
                    <span>${available ? '✅ มี' : '❌ ไม่มี'}</span>
                `;
                container.appendChild(item);
            });
        }

        function displayRecipeSteps(recipe) {
            const container = document.getElementById('recipeSteps');
            container.innerHTML = '';

            recipe.steps.forEach((step, index) => {
                const stepElement = document.createElement('div');
                stepElement.className = 'step-item';
                stepElement.innerHTML = `
                    <span class="step-number">${index + 1}</span>
                    <div class="step-text">${step.text} ${step.timer ? `(⏱️ ${step.time} นาที)` : ''}</div>
                `;
                container.appendChild(stepElement);
            });
        }

        function resetCookingControls() {
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('finishBtn').style.display = 'none';
            document.getElementById('timerDisplay').style.display = 'none';
        }

        // Cooking process functions
        function startCooking() {
            cookingStarted = true;
            currentStep = 0;
            totalTime = 0;

            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'inline-block';

            highlightCurrentStep();
            startStepTimer();

            alert('🚀 เริ่มทำอาหารแล้ว! ทำตามขั้นตอนไปทีละขั้น');
        }

        function nextStep() {
            const steps = document.querySelectorAll('.step-item');

            // Mark current step as completed
            steps[currentStep].classList.add('completed');
            steps[currentStep].classList.remove('active');

            currentStep++;

            if (currentStep >= currentRecipe.steps.length) {
                document.getElementById('nextBtn').style.display = 'none';
                document.getElementById('finishBtn').style.display = 'inline-block';
                stopTimer();
                return;
            }

            highlightCurrentStep();
            startStepTimer();
        }

        function finishCooking() {
            stopTimer();
            closeRecipeModal();

            // Show rating modal
            document.getElementById('ratedRecipeName').textContent = currentRecipe.name;
            document.getElementById('ratingModal').classList.add('active');

            // Reset star rating
            updateStarRating(0);
            document.getElementById('ratingComment').value = '';
        }

        function highlightCurrentStep() {
            const steps = document.querySelectorAll('.step-item');

            steps.forEach((step, index) => {
                step.classList.remove('active');
                if (index === currentStep) {
                    step.classList.add('active');
                    step.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        }

        function startStepTimer() {
            const currentStepData = currentRecipe.steps[currentStep];

            if (currentStepData.timer && currentStepData.time > 0) {
                let timeLeft = currentStepData.time * 60; // Convert to seconds

                document.getElementById('timerDisplay').style.display = 'block';

                timer = setInterval(() => {
                    const minutes = Math.floor(timeLeft / 60);
                    const seconds = timeLeft % 60;

                    document.getElementById('timerText').textContent =
                        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                    if (timeLeft <= 0) {
                        stopTimer();
                        alert(`⏰ ขั้นตอน "${currentStepData.text}" เสร็จแล้ว!`);
                        return;
                    }

                    timeLeft--;
                }, 1000);
            } else {
                document.getElementById('timerDisplay').style.display = 'none';
            }
        }

        function stopTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            document.getElementById('timerDisplay').style.display = 'none';
        }

        // Rating functions
        function submitRating() {
            const rating = getCurrentRating();
            const comment = document.getElementById('ratingComment').value.trim();

            if (rating === 0) {
                alert('กรุณาให้คะแนนก่อนส่ง');
                return;
            }

            // Here you would typically send the rating to a server
            const ratingData = {
                recipe: currentRecipe.name,
                rating: rating,
                comment: comment,
                timestamp: new Date().toISOString()
            };

            console.log('Rating submitted:', ratingData);

            let message = `🎉 ขอบคุณสำหรับคะแนน!\n\n`;
            message += `📊 เมนู: ${currentRecipe.name}\n`;
            message += `⭐ คะแนน: ${rating}/5\n`;
            if (comment) {
                message += `💬 ความคิดเห็น: ${comment}\n`;
            }
            message += `\n🤖 AI จะนำข้อมูลนี้ไปปรับปรุงคำแนะนำในครั้งถัดไป`;

            alert(message);
            closeRatingModal();
        }

        function closeRatingModal() {
            document.getElementById('ratingModal').classList.remove('active');
        }

        // Camera functions
        function openCamera() {
            document.getElementById('cameraOverlay').style.display = 'flex';

            setTimeout(() => {
                const mockIngredients = [
                    { name: '🥕 แครอท', amount: '3 หัว', expiry: '2025-09-18', daysLeft: 8 },
                    { name: '🥒 แตงกวา', amount: '2 ผล', expiry: '2025-09-16', daysLeft: 6 },
                    { name: '🍅 มะเขือเทศ', amount: '5 ผล', expiry: '2025-09-14', daysLeft: 4 }
                ];

                mockIngredients.forEach(ingredient => {
                    ingredients.push(ingredient);
                });

                updateIngredientsList();
                generateAISuggestions();
                closeCamera();

                alert('📸 ตรวจพบวัตถุดิบใหม่!\n\n✅ เพิ่มแล้ว:\n• แครอท 3 หัว\n• แตงกวา 2 ผล\n• มะเขือเทศ 5 ผล');
            }, 3000);
        }

        function closeCamera() {
            document.getElementById('cameraOverlay').style.display = 'none';
        }

        function checkExpiringIngredients() {
            const expiring = ingredients.filter(ing => ing.daysLeft <= 2);
            if (expiring.length > 0) {
                const expiredItems = expiring.map(ing => ing.name).join(', ');

                setTimeout(() => {
                    showWarningBanner(expiredItems);
                }, 2000);
            }
        }

        function showWarningBanner(expiredItems) {
            document.getElementById('warningItems').textContent = expiredItems;
            document.getElementById('warningBanner').classList.add('show');

            // Auto hide after 10 seconds
            setTimeout(() => {
                closeWarningBanner();
            }, 10000);
        }

        function closeWarningBanner() {
            document.getElementById('warningBanner').classList.remove('show');
        }

        // Navigation
        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });

            event.currentTarget.classList.add('active');
            switch (tab) {
                case 'home':
                    window.location.href = 'home.html';
                    break;
                case 'ingredients':

                    break;
                case 'recipes':
                    window.location.href = 'menu.html';
                    break;
                case 'profile':
                    window.location.href = 'profile.html';
                    break;
            }
        }
    </script>
</body>

</html>
