<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วัตถุดิบของฉัน - กินอะไรดี</title>
    <link rel="stylesheet" href="food.css">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <h1>📦 วัตถุดิบของฉัน</h1>
            <p>จัดการวัตถุดิบและรับคำแนะนำเมนูจาก AI</p>
        </div>

        <!-- Add Zone -->
        <div class="add-zone">
            <div class="add-methods">
                <button class="add-btn" onclick="openCamera()">
                    <span class="add-btn-icon">📸</span>
                    <span>ถ่ายรูปวัตถุดิบ</span>
                </button>
                <button class="add-btn" onclick="toggleManualAdd()">
                    <span class="add-btn-icon">✏️</span>
                    <span>กรอกข้อมูลเอง</span>
                </button>
            </div>

            <div class="manual-add" id="manualAddForm" style="display: none;">
                <div class="input-group">
                    <label class="input-label">ชื่อวัตถุดิบ</label>
                    <input type="text" class="input-field" id="ingredientName" placeholder="เช่น หมูสับ, ไก่, ผักกาด">
                </div>
                <div class="input-group">
                    <label class="input-label">ปริมาณ</label>
                    <input type="text" class="input-field" id="ingredientAmount" placeholder="เช่น 500g, 1 ถ้วย, 5 ใบ">
                </div>
                <div class="input-group">
                    <label class="input-label">วันหมดอายุ</label>
                    <input type="date" class="input-field" id="ingredientExpiry">
                </div>
                <button class="submit-btn" onclick="addIngredientManual()">เพิ่มวัตถุดิบ</button>
            </div>
        </div>

        <!-- Ingredients List -->
        <div class="ingredients-list">
            <div class="section-title">
                <span>🥬</span>
                วัตถุดิบทั้งหมด (<span id="totalCount">5</span> รายการ)
            </div>

            <div id="ingredientsList">
                <!-- Dynamic ingredients will be loaded here -->
            </div>

            <!-- AI Suggestions -->
            <div class="ai-suggestions">
                <div class="suggestion-title">
                    <span>🤖</span>
                    AI แนะนำเมนูจากวัตถุดิบที่มี
                </div>

                <div class="recipe-suggestions" id="aiSuggestions">
                    <!-- Recipe cards with images will be generated here -->
                </div>
            </div>
        </div>

        <!-- Camera Overlay -->
        <div class="camera-overlay" id="cameraOverlay">
            <div class="camera-content">
                <div class="camera-icon">📸</div>
                <h2>กำลังวิเคราะห์รูปภาพ...</h2>
                <p style="margin: 15px 0;">AI กำลังระบุวัตถุดิบในรูปภาพของคุณ</p>
                <div style="margin: 20px 0;">
                    <div style="font-size: 24px; margin: 10px 0;">🔍 กำลังสแกน...</div>
                </div>
                <button class="close-camera" onclick="closeCamera()">ปิด</button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <button class="nav-item" onclick="switchTab('home')">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">หน้าหลัก</span>
            </button>
            <button class="nav-item active" onclick="switchTab('ingredients')">
                <span class="nav-icon">📦</span>
                <span class="nav-text">วัตถุดิบ</span>
            </button>
            <button class="nav-item" onclick="switchTab('recipes')">
                <span class="nav-icon">🍽</span>
                <span class="nav-text">เมนู</span>
            </button>
            <button class="nav-item" onclick="switchTab('profile')">
                <span class="nav-icon">👤</span>
                <span class="nav-text">โปรไฟล์</span>
            </button>
        </div>
    </div>

    <script>
        // Global variables
        let ingredients = [
            { name: '🐷 หมูสับ', amount: '500g', expiry: '2025-09-15', daysLeft: 3 },
            { name: '🌿 ใบกะเพรา', amount: '1 ถ้วย', expiry: '2025-09-17', daysLeft: 7 },
            { name: '🥚 ไข่ไก่', amount: '6 ฟอง', expiry: '2025-09-12', daysLeft: 2 },
            { name: '🧅 หอมแดง', amount: '200g', expiry: '2025-09-20', daysLeft: 10 },
            { name: '🥛 นมสด', amount: '1 ลิตร', expiry: '2025-09-11', daysLeft: 1 },
            { name: '🌶️ พริกแกง', amount: '1 ลิตร', expiry: '2025-09-11', daysLeft: 1 }
        ];

        // Recipe database with images
        const recipeDatabase = {
            'ผัดกะเพราหมูสับ': {
                name: 'ผัดกะเพราหมูสับ',
                calories: 350,
                time: 15,
                ingredients: ['หมูสับ', 'กะเพรา', 'หอมแดง', 'พริก'],
                image: 'food1.jpg'
            },
            'ไข่เจียวหอมแดง': {
                name: 'ไข่เจียวหอมแดง',
                calories: 180,
                time: 8,
                ingredients: ['ไข่ไก่', 'หอมแดง'],
                image: 'food4.jpg'
            },
            'นมสดผัดซอส': {
                name: 'นมสดผัดซอส',
                calories: 280,
                time: 12,
                ingredients: ['นมสด', 'หอมแดง'],
                image: 'food5.jpg'
            },
            'ซุปไข่หวาน': {
                name: 'ซุปไข่หวาน',
                calories: 150,
                time: 10,
                ingredients: ['ไข่ไก่', 'นมสด'],
                image: 'food6.jpg'
            }
        };

        // Initialize app
        document.addEventListener('DOMContentLoaded', function () {
            updateIngredientsList();
            generateAISuggestions();
            setupEventListeners();
            checkExpiringIngredients();

            // Set default expiry date (next week)
            const nextWeek = new Date();
            nextWeek.setDate(nextWeek.getDate() + 7);
            document.getElementById('ingredientExpiry').value = nextWeek.toISOString().split('T')[0];
        });

        function setupEventListeners() {
            // Add any necessary event listeners
        }

        // Ingredient management functions
        function toggleManualAdd() {
            const form = document.getElementById('manualAddForm');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        function addIngredientManual() {
            const name = document.getElementById('ingredientName').value.trim();
            const amount = document.getElementById('ingredientAmount').value.trim();
            const expiry = document.getElementById('ingredientExpiry').value;

            if (!name || !amount || !expiry) {
                alert('⚠ กรุณากรอกข้อมูลให้ครบถ้วน');
                return;
            }

            const today = new Date();
            const expiryDate = new Date(expiry);
            const daysLeft = Math.ceil((expiryDate - today) / (1000 * 60 * 60 * 24));

            const emojiMap = {
                'หมู': '🐷', 'ไก่': '🐔', 'เนื้อ': '🐄', 'ปลา': '🐟', 'กุ้ง': '🦐',
                'ไข่': '🥚', 'นม': '🥛', 'เนย': '🧈', 'ชีส': '🧀',
                'ข้าว': '🍚', 'เส้น': '🍜', 'แป้ง': '🌾',
                'กะเพรา': '🌿', 'ผัก': '🥬', 'หอม': '🧅', 'กระเทียม': '🧄',
                'มะเขือเทศ': '🍅', 'พริก': '🌶️', 'มะนาว': '🍋'
            };

            let emoji = '🥗';
            for (const [key, value] of Object.entries(emojiMap)) {
                if (name.includes(key)) {
                    emoji = value;
                    break;
                }
            }

            const ingredient = {
                name: `${emoji} ${name}`,
                amount: amount,
                expiry: expiry,
                daysLeft: daysLeft
            };

            ingredients.push(ingredient);
            updateIngredientsList();
            generateAISuggestions();

            document.getElementById('ingredientName').value = '';
            document.getElementById('ingredientAmount').value = '';
            document.getElementById('ingredientExpiry').value = '';

            alert(`✅ เพิ่ม "${name}" เรียบร้อยแล้ว!`);
            toggleManualAdd();
        }

        function removeIngredient(btn) {
            const card = btn.parentElement;
            const ingredientName = card.querySelector('.ingredient-name').textContent;

            if (confirm(`คุณต้องการลบ "${ingredientName}" หรือไม่?`)) {
                const index = ingredients.findIndex(ing => ing.name === ingredientName);
                if (index > -1) {
                    ingredients.splice(index, 1);
                }

                card.remove();
                updateTotalCount();
                generateAISuggestions();

                alert(`🗑️ ลบ "${ingredientName}" เรียบร้อยแล้ว`);
            }
        }

        function updateIngredientsList() {
            const list = document.getElementById('ingredientsList');
            list.innerHTML = '';

            ingredients.forEach(ingredient => {
                const expiryClass = ingredient.daysLeft <= 1 ? 'expiry-danger' :
                    ingredient.daysLeft <= 3 ? 'expiry-warning' : 'expiry-fresh';

                const card = document.createElement('div');
                card.className = 'ingredient-card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="removeIngredient(this)">×</button>
                    <div class="ingredient-header">
                        <span class="ingredient-name">${ingredient.name}</span>
                        <span class="ingredient-amount">${ingredient.amount}</span>
                    </div>
                    <div class="ingredient-details">
                        <span>เหลือ ${ingredient.daysLeft} วัน</span>
                        <span class="expiry-date ${expiryClass}">${new Date(ingredient.expiry).toLocaleDateString('th-TH')}</span>
                    </div>
                `;
                list.appendChild(card);
            });

            updateTotalCount();
        }

        function updateTotalCount() {
            document.getElementById('totalCount').textContent = ingredients.length;
        }

        function generateAISuggestions() {
            const suggestions = document.getElementById('aiSuggestions');
            suggestions.innerHTML = '';

            const availableRecipes = [];

            Object.keys(recipeDatabase).forEach(recipeName => {
                const recipe = recipeDatabase[recipeName];
                const hasIngredients = recipe.ingredients.every(reqIngredient => {
                    return ingredients.some(availableIng =>
                        availableIng.name.toLowerCase().includes(reqIngredient.toLowerCase())
                    );
                });

                if (hasIngredients) {
                    availableRecipes.push(recipe);
                }
            });

            // Sort by priority (expiring ingredients first)
            availableRecipes.sort((a, b) => {
                const aHasExpiring = a.ingredients.some(ing =>
                    ingredients.some(availIng =>
                        availIng.name.toLowerCase().includes(ing.toLowerCase()) && availIng.daysLeft <= 2
                    )
                );
                const bHasExpiring = b.ingredients.some(ing =>
                    ingredients.some(availIng =>
                        availIng.name.toLowerCase().includes(ing.toLowerCase()) && availIng.daysLeft <= 2
                    )
                );

                if (aHasExpiring && !bHasExpiring) return -1;
                if (!aHasExpiring && bHasExpiring) return 1;
                return a.calories - b.calories;
            });

            availableRecipes.forEach(recipe => {
                const hasExpiringIngredients = recipe.ingredients.some(ing =>
                    ingredients.some(availIng =>
                        availIng.name.toLowerCase().includes(ing.toLowerCase()) && availIng.daysLeft <= 2
                    )
                );

                const card = document.createElement('a');  // ✅ แก้จาก cconst → const
                card.className = 'recipe-card';
                card.href = 'sol.html';       // ลิงก์ไป sol.html
                card.target = '_blank';       // เปิดในแท็บใหม่ (ลบได้ถ้าอยากเปิดในแท็บเดียว)

                const urgencyBadge = hasExpiringIngredients
                    ? '<span style="background:#ff4444;color:white;font-size:10px;padding:2px 6px;border-radius:10px;margin-left:4px;">⚡ ด่วน</span>'
                    : '';

                card.innerHTML = `
        <img src="${recipe.image}" alt="${recipe.name}" class="recipe-photo" onError="this.style.display='none'">
        <div class="recipe-info">
            <div class="recipe-name">${recipe.name}${urgencyBadge}</div>
            <div class="recipe-details">
                <span>🔥 ${recipe.calories} แคล</span>
                <span>⏱️ ${recipe.time} นาที</span>
            </div>
            <div class="recipe-ingredients">ใช้: ${recipe.ingredients.join(', ')}</div>
        </div>
    `; // ✅ ปิด backtick ให้เรียบร้อย

                suggestions.appendChild(card);
            });


            if (availableRecipes.length === 0) {
                suggestions.innerHTML = `
                    <div style="text-align: center; padding: 20px; opacity: 0.8; grid-column: 1 / -1;">
                        <div style="font-size: 32px; margin-bottom: 10px;">🤔</div>
                        <div>เพิ่มวัตถุดิบเพื่อรับคำแนะนำเมนูจาก AI</div>
                    </div>
                `;
            }
        }

        // Camera functions
        function openCamera() {
            document.getElementById('cameraOverlay').style.display = 'flex';

            setTimeout(() => {
                const mockIngredients = [
                    { name: '🥕 แครอท', amount: '3 หัว', expiry: '2025-09-18', daysLeft: 8 },
                    { name: '🥒 แตงกวา', amount: '2 ผล', expiry: '2025-09-16', daysLeft: 6 },
                    { name: '🍅 มะเขือเทศ', amount: '5 ผล', expiry: '2025-09-14', daysLeft: 4 }
                ];

                mockIngredients.forEach(ingredient => {
                    ingredients.push(ingredient);
                });

                updateIngredientsList();
                generateAISuggestions();
                closeCamera();

                alert('📸 ตรวจพบวัตถุดิบใหม่!\n\n✅ เพิ่มแล้ว:\n• แครอท 3 หัว\n• แตงกวา 2 ผล\n• มะเขือเทศ 5 ผล');
            }, 3000);
        }

        function closeCamera() {
            document.getElementById('cameraOverlay').style.display = 'none';
        }

        function checkExpiringIngredients() {
            const expiring = ingredients.filter(ing => ing.daysLeft <= 2);
            if (expiring.length > 0) {
                const expiredItems = expiring.map(ing => ing.name).join(', ');

                setTimeout(() => {
                    alert(`⚠️ วัตถุดิบใกล้หมดอายุ: ${expiredItems}`);
                }, 2000);
            }
        }

        // Navigation
        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });

            event.currentTarget.classList.add('active');
            switch (tab) {
                case 'home':
                    alert('🏠 กำลังไปหน้าหลัก...');
                    break;
                case 'ingredients':
                    // Already on ingredients page
                    break;
                case 'recipes':
                    alert('🍽 กำลังไปหน้าเมนู...');
                    break;
                case 'profile':
                    alert('👤 กำลังไปหน้าโปรไฟล์...');
                    break;
            }
        }


        function switchTab(tab) {
            // Remove active class from all nav items
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });

            // Add active class to clicked item
            event.currentTarget.classList.add('active');

            // Show different content based on tab
            switch (tab) {
                case 'home':
                    window.location.href = 'home.html';
                    break;
                case 'ingredients':

                    break;
                case 'recipes':
                    window.location.href = 'menu.html';
                    break;
                case 'profile':
                    window.location.href = 'profile.html';
                    break;
            }

        }
    </script>
</body>

</html>
